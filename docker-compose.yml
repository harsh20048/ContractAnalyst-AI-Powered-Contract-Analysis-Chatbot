version: '3.8'

services:
  hf-pdf-extractor:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: hf-pdf-extractor
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO
      - MAX_FILE_SIZE=52428800  # 50MB
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=1
    volumes:
      - ./uploads:/app/uploads
      - ./processed:/app/processed
      - ./vector_db:/app/vector_db
      - ./model_cache:/app/model_cache
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    networks:
      - hf-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Redis for caching (uncomment if needed)
  # redis:
  #   image: redis:7-alpine
  #   container_name: hf-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - hf-network

  # Optional: Nginx reverse proxy (uncomment for production)
  # nginx:
  #   image: nginx:alpine
  #   container_name: hf-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - hf-pdf-extractor
  #   networks:
  #     - hf-network

networks:
  hf-network:
    driver: bridge

volumes:
  # redis_data:  # Uncomment if using Redis
  uploads:
  processed:
  vector_db:
  model_cache:
  logs: